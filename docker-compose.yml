services:
  go-dev:
    image: golang:1.25-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -c "apk add --no-cache ca-certificates git && tail -f /dev/null"
    environment:
      - CGO_ENABLED=0
    # Optionally expose ports if your app needs it
    # ports:
    #   - "9000:9000"
